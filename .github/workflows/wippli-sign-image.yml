name: wippli-sign-image
# Builds the Wippli Sign image for the FAIRFIELD-Z840 box (linux/amd64) and pushes it to GHCR.
# Deploy to the box is a separate, later step.
on:
  workflow_dispatch:
  push:
    branches: [wippli-sign-consolidated]
    paths-ignore: ['**.md', 'docs/**']
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/wippli-org/wippli-sign:consolidated
            ghcr.io/wippli-org/wippli-sign:head-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
